; Velo: derived from SilentSDDM (GPL-3.0-or-later). See NOTICE.

[General]
scale = 1.3
enable-animations = true
animated-background-placeholder = ""
background-fill-mode = "fill"
slideshow-interval = 60
primary-screen = ""

[LockScreen]
display = true
padding-top = 90
padding-right = 0
padding-bottom = 0
padding-left = 0
background = "default.jpg"
use-background-color = false
background-color = "#000000"
blur = 0
brightness = 0.0
saturation = 0.0

[LockScreen.Scrim]
display = true
color = "#000000"
top-opacity = 0.5
top-height = 0.45
bottom-opacity = 0.4
bottom-height = 0.22

[LockScreen.Clock]
display = true
position = "top-center"
align = "center"
format = "hh:mm"
font-family = "Noto Sans"
font-size = 105
font-weight = 600
color = "#FFFFFF"
outline = false
outline-color = "#80606060"

[LockScreen.Date]
display = true
format = "dddd, MMMM d, yyyy"
locale = "en_US"
font-family = "Noto Sans"
font-size = 26
font-weight = 700
color = "#FFFFFF"
outline = false
outline-color = "#80606060"
margin-top = 0

[LockScreen.Message]
display = true
position = "bottom-center"
align = "center"
text = "Press any key"
font-family = "Noto Sans"
font-size = 14
font-weight = 500
display-icon = true
icon = "enter.svg"
icon-size = 16
color = "#FFFFFF"
paint-icon = true
spacing = 8

[LoginScreen]
background = "default.jpg"
use-background-color = false
background-color = "#000000"
blur = 0
brightness = 0.0
saturation = 0.0

[LoginScreen.Scrim]
display = true
color = "#000000"
bottom-opacity = 0.45
bottom-height = 0.22

[LoginScreen.Card]
display = false
color = "#3C3C3C"
opacity = 0.6
radius = 14
border-size = 1
border-color = "#99C0C0C0"
padding-x = 70
padding-y = 45
header-spacing = 24

[LoginScreen.Clock]
display = false
format = "hh:mm"
font-family = "Noto Sans"
font-size = 60
font-weight = 900
color = "#FFFFFF"
outline = true
outline-color = "#80606060"

[LoginScreen.Date]
display = false
format = "dddd, MMMM d, yyyy"
locale = "en_US"
font-family = "Noto Sans"
font-size = 18
font-weight = 800
color = "#FFFFFF"
outline = true
outline-color = "#80606060"
margin-top = 0

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "circle"
border-radius = 35
active-size = 120
inactive-size = 80
inactive-opacity = 0.35
active-border-size = 0
inactive-border-size = 0
active-border-color = "#FFFFFF"
inactive-border-color = "#FFFFFF"
always-active = false

[LoginScreen.LoginArea.Username]
font-family = "Noto Sans"
font-size = 22
font-weight = 900
color = "#FFFFFF"
outline = true
outline-color = "#80606060"
margin = 10

[LoginScreen.LoginArea.PasswordInput]
width = 200
height = 30
display-icon = true
font-family = "Noto Sans"
font-size = 12
icon = "password.svg"
icon-size = 16
content-color = "#FFFFFF"
background-color = "#FFFFFF"
background-opacity = 0.15
border-size = 0
border-color = "#FFFFFF"
border-radius-left = 10
border-radius-right = 10
margin-top = 10
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "#FFFFFF"
background-opacity = 0.15
active-background-color = "#FFFFFF"
active-background-opacity = 0.30
icon = "arrow-right.svg"
icon-size = 18
content-color = "#FFFFFF"
active-content-color = "#FFFFFF"
border-size = 0
border-color = "#FFFFFF"
border-radius-left = 10
border-radius-right = 10
margin-left = 5
show-text-if-no-password = true
hide-if-not-needed = false
font-family = "Noto Sans"
font-size = 12
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Logging in"
font-family = "Noto Sans"
font-weight = 600
font-size = 14
icon-size = 30
icon = "spinner.svg"
color = "#FFFFFF"
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = "Noto Sans"
font-size = 11
font-weight = 400
normal-color = "#FFFFFF"
warning-color = "#FFFFFF"
error-color = "#FFFFFF"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 50
margin-right = 50
margin-bottom = 50
margin-left = 50
size = 30
border-radius = 5
spacing = 10
font-family = "Noto Sans"

[LoginScreen.MenuArea.Popups]
max-height = 300
item-height = 30
item-spacing = 2
padding = 5
display-scrollbar = true
margin = 5
background-color = "#FFFFFF"
background-opacity = 0.15
active-option-background-color = "#FFFFFF"
active-option-background-opacity = 0.30
content-color = "#FFFFFF"
active-content-color = "#FFFFFF"
font-family = "Noto Sans"
border-size = 0
border-color = "#FFFFFF"
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-left"
index = 0
popup-direction = "up"
popup-align = "center"
display-session-name = true
button-width = 200
popup-width = 200
background-color = "#FFFFFF"
background-opacity = 0.0
active-background-opacity = 0.30
content-color = "#FFFFFF"
active-content-color = "#FFFFFF"
border-size = 0
font-size = 10
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = false
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 180
display-layout-name = false
background-color = "#FFFFFF"
background-opacity = 0.0
active-background-opacity = 0.30
content-color = "#FFFFFF"
active-content-color = "#FFFFFF"
border-size = 0
font-size = 10
icon = "language.svg"
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-right"
index = 0
background-color = "#FFFFFF"
background-opacity = 0.0
active-background-opacity = 0.30
content-color = "#FFFFFF"
active-content-color = "#FFFFFF"
border-size = 0
icon = "keyboard.svg"
icon-size = 16

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 100
background-color = "#FFFFFF"
background-opacity = 0.0
active-background-opacity = 0.30
content-color = "#FFFFFF"
active-content-color = "#FFFFFF"
border-size = 0
icon = "power.svg"
icon-size = 16

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "#FFFFFF"
background-opacity = 0.15
key-content-color = "#FFFFFF"
key-color = "#FFFFFF"
key-opacity = 0.15
key-active-background-color = "#FFFFFF"
key-active-opacity = 0.30
selection-background-color = "#CCCCCC"
selection-content-color = "#FFFFFF"
primary-color = "#FFF"
border-size = 0
border-color = "#000000"
restrict-input = "none"

[Tooltips]
enable = true
font-family = "Noto Sans"
font-size = 11
content-color = "#FFFFFF"
background-color = "#FFFFFF"
background-opacity = 0.15
border-radius = 5
disable-user = false
disable-login-button = false
session-text = "Change session"
layout-text = "Change keyboard layout"
virtual-keyboard-text = "Toggle virtual keyboard"
power-text = "Power options"
select-user-text = "Select user"
close-user-selection-text = "Close user selection"
