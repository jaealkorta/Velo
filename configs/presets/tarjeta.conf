; Nombre: Tarjeta
; Descripción: Inicio de sesión dentro de un recuadro translúcido, con la hora y la fecha encima de la foto. La pantalla de bloqueo no cambia.
; Solo se cambia el inicio de sesión.

[LoginScreen.Card]
display = true
color = "#3C3C3C"
opacity = 0.6
radius = 14

[LoginScreen.Clock]
display = true
font-size = 60
font-weight = 900
color = "#FFFFFF"
outline = true

[LoginScreen.Date]
display = true
font-size = 18
font-weight = 800
color = "#FFFFFF"
outline = true

[LoginScreen.Scrim]
display = false
