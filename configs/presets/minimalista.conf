; Nombre: Minimalista
; Descripción: Sin degradados ni mensaje. En el bloqueo, hora fina abajo a la izquierda con la fecha debajo. Inicio de sesión sin recuadro, hora ni fecha.
; Solo se cambian el aspecto y la posición; el fondo, el idioma y la fuente se quedan como estén.

[LockScreen.Clock]
display = true
position = "bottom-left"
font-size = 80
font-weight = 300
color = "#FFFFFF"
outline = false

[LockScreen.Date]
display = true
font-size = 20
font-weight = 400
margin-top = 0
color = "#FFFFFF"
outline = false

[LockScreen.Message]
display = false

[LockScreen.Scrim]
display = false

[LoginScreen.Card]
display = false

[LoginScreen.Clock]
display = false

[LoginScreen.Date]
display = false

[LoginScreen.Scrim]
display = false
