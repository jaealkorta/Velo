; Nombre: Windows 11
; Descripción: Bloqueo con hora grande arriba, fecha debajo y «Pulse cualquier tecla» abajo, con degradados. Inicio de sesión limpio: solo foto, nombre y contraseña.
; Solo se cambian el aspecto y la posición; el fondo, el idioma y la fuente se quedan como estén.

[LockScreen.Clock]
display = true
position = "top-center"
font-size = 105
font-weight = 600
color = "#FFFFFF"
outline = false

[LockScreen.Date]
display = true
font-size = 26
font-weight = 700
margin-top = 0
color = "#FFFFFF"
outline = false

[LockScreen.Message]
display = true
position = "bottom-center"
font-size = 14
font-weight = 500
display-icon = true
icon-size = 16
spacing = 8
color = "#FFFFFF"

[LockScreen.Scrim]
display = true
color = "#000000"
top-opacity = 0.5
top-height = 0.45
bottom-opacity = 0.4
bottom-height = 0.22

[LoginScreen.Card]
display = false

[LoginScreen.Clock]
display = false

[LoginScreen.Date]
display = false

[LoginScreen.Scrim]
display = true
color = "#000000"
bottom-opacity = 0.45
bottom-height = 0.22
